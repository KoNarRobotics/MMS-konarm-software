include: [mcan_basic_module,mcan_ros_types]

# TODO : lepsze opisy niż "?" xD
# TODO : zapytać, które ramki mają zostać z poprzedniego CAN'a, a które wywalają

hardware:
  name: konarm_hat
  vendor: konar
  unique_id: 0x6767676767676767 # this will be 64-bit unique identifier fpr the series of the same module
  hw_revision: 1
  fw_revision: 1
  date: 2026-01-15
  description: "HAT module used in konarm"
  inherit: [mcan_basic_module]
  power_requirements:
    voltage: 48V
    current: 0.1A

custom_types:
  joint_status_enum:
    type: enum
    readable_name: "Joint Status Enum"
    description: "Possible states of the joints"
    values:
      0: "OK"
      1: "FAULT"
      2: "OVERHEAT"
      3: "EMERGENCY_STOP"

  position:
    type: struct
    readable_name: "Position of joint"
    description: "Position of joint: position, and velocity"
    fields:
      position:
        var_type: float
        description: "?"
      velocity:
        var_type: float
        description: "?"

  error_status:
    type: enum
    readable_name: "Error Status"
    description: ""
    values:
      0: "OK"
      1: "FAULT"

  errors_status:
    type: struct
    readable_name: "Struct error statuses"
    description: "Struct of diffrent error statuses"
    fields:
      temp_engine_overheating:
        var_type: error_status
      temp_driver_overheating:
        var_type: error_status
      temp_board_overheating:
        var_type: error_status
      temp_engine_sensor_disconnect:
        var_type: error_status
      temp_driver_sensor_disconnect:
        var_type: error_status
      temp_board_sensor_disconnect:
        var_type: error_status
      encoder_arm_disconnect:
        var_type: error_status
      encoder_arm_disconnect:
        var_type: error_status
      board_overvoltage:
        var_type: error_status
      board_undervoltage:
        var_type: error_status
      can_disconnected:
        var_type: error_status
      can_error:
        var_type: error_status
      controler_motor_limit_position:
        var_type: error_status

  control_mode:
    type: enum
    readable_name: "Control Mode"
    description: ""
    values:
      0: "VELOCITY_CONTROL"
      1: "POSITION_CONTROL"
      2: "TORQUE_CONTROL"
  

messages:
  commands: # this section defines commands that can be sent to the module
    set_position:
      readable_name: "Set position"
      description: "Command to set position"
      var_type: position
    
    set_torque:
      readable_name: "Set torque"
      description: "Command to set torque"
      var_type: float

    clear_errors:
      readable_name: "Clear errors"
      description: "Command to clear errors"
      var_type: bool

    set_control_mode:
      readable_name: "Set control mode"
      description: "Command to set control mode"
      var_type: control_mode

    set_and_reset:
      readable_name: "set_and_reset"
      description: "set_and_reset"
      var_type: bool
  
  states:
    joint_status:
      name: "Status of joint"
      description: "Current status of the joint"
      var_type: joint_status
  
    current_position:
      name: "Current Position"
      description: "Current position of the joint"
      var_type: position

    torque:
      name: "Current Torque"
      description: "Current torque"
      units: "Nm"
      var_type: float

    errors:
      name: "Get Errors"
      description: "IDK"
      var_type: errors_status

  configs:
    config:
      name: "Config"
      description: "Get config"
      var_type : float

